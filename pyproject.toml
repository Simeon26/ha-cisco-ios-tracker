[project]
name = "ha-cisco-ios-tracker"
version = "1.2.0"
description = "Home Assistant custom integration: presence detection from the ARP table of a Cisco IOS/IOS-XE device"
requires-python = ">=3.14.2"
readme = "README.md"
license = "Apache-2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=custom_components.cisco_ios_tracker --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components.cisco_ios_tracker"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
target-version = "py314"
required-version = ">=0.16.9"

[tool.ruff.lint]
select = [
  "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004",
  "DTZ011", "E", "F", "FLY", "FURB", "G", "I", "ISC", "LOG", "N804",
  "N805", "N806", "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI",
  "RET", "RSE", "RUF", "S102", "S103", "S108", "S307", "S601", "S602",
  "S604", "SIM", "SLF", "SLOT", "T100", "T20", "TC", "TID", "TRY", "UP",
  "W",
]
ignore = [
  "ASYNC109", "ASYNC110", "ASYNC240", "B008", "B019",
  "D202", "D203", "D213", "D406", "D407", "D417", "E501",
  "PLC1901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  "PLR2004", "PLW1641", "PLW2901", "PT011", "PT018",
  "RUF001", "RUF012", "SIM102", "SIM103", "SIM108", "SIM115",
  "TC001", "TC002", "TC003", "TC006", "TRY003", "TRY400",
  "UP047", "UP049",
  # Conflict with the formatter
  "W191", "E111", "E114", "E117", "D206", "D300", "Q", "COM812", "COM819",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "PLC0415", "S108"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"__future__.annotations".msg = "Not needed: Home Assistant requires Python 3.14+"

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
voluptuous = "vol"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
"homeassistant.util.dt" = "dt_util"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.cisco_ios_tracker", "homeassistant", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
platform = "linux"
files = ["custom_components/cisco_ios_tracker"]
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_equality = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = ["deprecated", "ignore-without-code", "redundant-self", "truthy-iterable"]
