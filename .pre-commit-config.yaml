repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,ser
        exclude: ^(tests/snapshots/|LICENSE$)|\.(json|ambr|png)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        # Fixtures are byte-exact device captures (CRLF, backspaces, no final newline).
        exclude: ^tests/(snapshots|fixtures)/
      - id: trailing-whitespace
        exclude: ^tests/(snapshots|fixtures)/
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^custom_components/.+\.py$
