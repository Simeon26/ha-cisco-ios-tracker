repos:
  # Ruff and mypy run from the virtual environment, so they use the versions
  # pinned in requirements_lint.txt, the same ones CI and Dependabot use.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,ser
        exclude: ^(tests/snapshots/|LICENSE$)|\.(json|ambr|png)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        # Fixtures are byte-exact device captures (CRLF, backspaces, no final newline).
        exclude: ^tests/(snapshots|fixtures)/
      - id: trailing-whitespace
        exclude: ^tests/(snapshots|fixtures)/
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^custom_components/.+\.py$
